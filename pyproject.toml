[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tatahome-ha"
version = "0.1.0"
description = "Home Assistant custom integration for TATAHome robot vacuums"
requires-python = ">=3.14"
license = {text = "MIT"}

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
